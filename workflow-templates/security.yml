name: security

# Org security scan for this repo — calls the shared reusable workflow.
# Add via GitHub UI: Actions -> New workflow -> "Security scan (cognitum-one)".

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly drift sweep

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    # PR2 bootstrap: replace this fail-closed zero ref with the reviewed PR2
    # content commit before merging the final pin-only commit.
    uses: cognitum-one/.github/.github/workflows/security-scan.yml@e0a423bede1c7855e62b27832ec5cc0167c13d03
    # Required only for cognitum-one/website. Other repositories may omit the
    # mapping; the shared workflow never receives unrelated repository secrets.
    secrets:
      static_ui_beacon_read_token: ${{ secrets.STATIC_UI_BEACON_READ_TOKEN }}
