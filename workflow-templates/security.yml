name: scheduled fleet security audit

# Optional central drift audit. Product pull-request, merge, and deployment gates
# must be implemented and enforced inside the product repository; this template
# must never provide their required `security / enforcement` context.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly drift sweep

permissions:
  contents: read

# Each audit run builds a container image for the static-UI receipt, so without
# a group four merges inside two minutes produce
# four simultaneous docker builds. Measured on cognitum-one/website 2026-08-20:
# 13 of 13 self-hosted runners busy and production publishes queued behind them
# for about an hour.
#
# cancel-in-progress is false so every scheduled/manual audit keeps a complete
# drift receipt. These results are evidence, not product merge/deploy authority.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fleet-audit:
    name: fleet audit
    permissions:
      contents: read
    # This audit pin is reviewed independently from the legacy static-UI release
    # workflow pins. It names the frozen #91 base containing SecurityPolicy/v1
    # and the latest merged evidence-provenance fixes.
    uses: cognitum-one/.github/.github/workflows/security-scan.yml@74a6a55a314a8701386942f04170ae4cc9807741
    # Required only for cognitum-one/website. Other repositories may omit the
    # mapping; the shared workflow never receives unrelated repository secrets.
    #
    # These two feed `actions/create-github-app-token` inside the shared workflow,
    # which mints a token scoped to exactly [website, beacon] with contents:read
    # for the life of the job. Nothing long-lived is stored.
    secrets:
      static_ui_bridge_app_id: ${{ secrets.STATIC_UI_BRIDGE_APP_ID }}
      static_ui_bridge_app_private_key: ${{ secrets.STATIC_UI_BRIDGE_APP_KEY }}
