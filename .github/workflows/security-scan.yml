name: security-scan

# Reusable org-wide security scan. Callers:
#   jobs.scan.uses: cognitum-one/.github/.github/workflows/security-scan.yml@main
#
# Secrets are scanned in TWO modes (ADR-092):
#   secrets               — CURRENT files only (--no-git), BLOCKING on every
#                           push/PR. Respects inline `gitleaks:allow` and the
#                           org allowlist; no historical-fixture noise.
#   secrets-history-audit — FULL history FINDINGS are informational, on the
#                           weekly schedule (and manual dispatch) only.
#                           Integrity, execution, and parse failures still block.
# OSV policy: fails only on High/Critical vulnerabilities that have a fix, AND only
#   when the affected package can actually ship. A finding reachable ONLY through
#   devDependencies (test runners, coverage tooling, linters) never reaches a
#   deployed artifact, so it is reported as a WARNING instead of blocking every PR
#   in the org. Dev-only status is PROVEN from the npm lockfile's own `dev` flag;
#   anything not provably dev-only still blocks (fail-closed), which includes every
#   non-npm ecosystem (Cargo, Go, PyPI) where no such distinction is recorded.
#   Nothing is hidden: dev-only findings are printed and written to the job summary.

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_CONFIG_COMMIT: "9375207473d6cd67c45ce5a0ed52ba7012dba366"
  GITLEAKS_CONFIG_SHA256: "5018f890f807791f06b3f3e49c543dde8bb96dae7f984d74437ec57cc8f75e8e"
  OSV_VERSION: "2.2.4"
  OSV_LINUX_AMD64_SHA256: "7702cd1e5d9f5059dd9570f4ad967f27d3c5f5391b371ec937b384c238177f55"

jobs:
  secrets:
    name: secret scan (current files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run gitleaks (current files, blocking)
        run: |
          set -euo pipefail
          # Only fetch the org config when no repo-local override exists — it
          # is pinned by commit and hash and stored outside the scan target.
          CFG=()
          if [ ! -f .gitleaks.toml ]; then
            ORG_CONFIG="$RUNNER_TEMP/gitleaks.org.toml"
            curl --proto '=https' --tlsv1.2 -fsSLo "$ORG_CONFIG" \
              "https://raw.githubusercontent.com/cognitum-one/.github/${GITLEAKS_CONFIG_COMMIT}/gitleaks.toml"
            echo "${GITLEAKS_CONFIG_SHA256}  ${ORG_CONFIG}" | sha256sum -c -
            CFG=(--config "$ORG_CONFIG")
          else
            CFG=(--config .gitleaks.toml)
          fi
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks version | grep -F "$GITLEAKS_VERSION"
          # --no-git: scan the working tree (current files) only. Blocks new
          # secrets; ignores older commits (those are the history audit's job).
          ./gitleaks detect --source . --no-git "${CFG[@]}" --redact --exit-code 1

  secrets-history-audit:
    name: secret scan (full history audit)
    # Findings are informational; scanner integrity/execution failures block.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run gitleaks (full history, informational)
        run: |
          set -euo pipefail
          CFG=()
          if [ ! -f .gitleaks.toml ]; then
            ORG_CONFIG="$RUNNER_TEMP/gitleaks.org.toml"
            curl --proto '=https' --tlsv1.2 -fsSLo "$ORG_CONFIG" \
              "https://raw.githubusercontent.com/cognitum-one/.github/${GITLEAKS_CONFIG_COMMIT}/gitleaks.toml"
            echo "${GITLEAKS_CONFIG_SHA256}  ${ORG_CONFIG}" | sha256sum -c -
            CFG=(--config "$ORG_CONFIG")
          else
            CFG=(--config .gitleaks.toml)
          fi
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks version | grep -F "$GITLEAKS_VERSION"
          # Findings do not fail this job because exit-code is zero. Scanner
          # integrity, execution, and report-parse failures remain blocking.
          ./gitleaks detect --source . "${CFG[@]}" --redact \
            --report-format json --report-path history.json --exit-code 0
          n="$(python3 -c "import json; print(len(json.load(open('history.json'))))")"
          if [ "$n" -gt 0 ]; then
            echo "::warning::Full-history audit found $n secret finding(s) in git history — review (not blocking; may be removed/rotated secrets)."
            {
              echo "## 🔎 Full-history secret audit — $n finding(s)"
              echo "These are in git *history* (removed/rotated or historical fixtures). Rotate anything real; allowlist confirmed non-secrets in gitleaks.toml."
              echo ""
              python3 -c "import json;[print('- \`'+x.get('RuleID','?')+'\` '+x.get('File','?')+':'+str(x.get('StartLine','?'))+' @ '+x.get('Commit','')[:8]) for x in json.load(open('history.json'))[:50]]" 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full-history audit: clean."
          fi

  deps:
    name: dependency scan (OSV, fail on High+ fixable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Write the OSV gate script
        run: |
          cat > .osv-gate.py <<'GATE_EOF'
          import json, os, sys

          # ---- Which (name, version) pairs are reachable ONLY via devDependencies? ----
          # npm records this itself: in a lockfile v2/v3 `packages` map, an entry carries
          # `dev: true` when nothing in the production graph reaches it. A package counts as
          # dev-only for a given lockfile when EVERY entry for it in that lockfile is dev.
          # Resolved per-lockfile and keyed by the scanner's own source path, so a package
          # that is dev here and production there is never mistakenly excused.
          def dev_only_pairs(lock_path):
              out = {}
              try:
                  with open(lock_path) as fh:
                      lock = json.load(fh)
              except Exception:
                  return out  # unreadable -> nothing is excused (fail-closed)
              for path, meta in (lock.get("packages") or {}).items():
                  if not path or not isinstance(meta, dict):
                      continue  # "" is the root project itself
                  name = meta.get("name") or path.split("node_modules/")[-1]
                  ver = meta.get("version")
                  if not name or not ver:
                      continue
                  is_dev = bool(meta.get("dev") or meta.get("devOptional"))
                  key = (name, ver)
                  # any non-dev occurrence wins -> the package can ship
                  out[key] = is_dev and out.get(key, True)
              return {k for k, v in out.items() if v}

          try:
              data = json.load(open("osv.json"))
          except Exception as error:
              print("::error::OSV JSON is missing or invalid: %s" % error)
              sys.exit(2)
          if not isinstance(data, dict) or not isinstance(data.get("results"), list):
              print("::error::OSV JSON does not contain a results array")
              sys.exit(2)

          blocking, dev_only = [], []
          for res in data.get("results", []):
              src = ((res.get("source") or {}).get("path")) or ""
              excused = dev_only_pairs(src) if src.endswith("package-lock.json") else set()
              for pkg in res.get("packages", []):
                  sev = {}
                  for grp in pkg.get("groups", []):
                      for vid in grp.get("ids", []):
                          sev[vid] = grp.get("max_severity", "") or "0"
                  name = pkg["package"]["name"]
                  ver = pkg["package"]["version"]
                  for vuln in pkg.get("vulnerabilities", []):
                      fixed = any(
                          "fixed" in ev
                          for aff in vuln.get("affected", [])
                          for rng in aff.get("ranges", [])
                          for ev in rng.get("events", [])
                      )
                      try:
                          score = float(sev.get(vuln["id"], "0") or 0)
                      except Exception:
                          score = 0.0
                      if not (fixed and score >= 7.0):
                          continue
                      row = (name, ver, vuln["id"], score, src)
                      (dev_only if (name, ver) in excused else blocking).append(row)

          def fmt(rows):
              return [
                  "  CVSS %.1f  %s@%s  %s  (%s)" % (s, n, v, i, p or "?")
                  for n, v, i, s, p in sorted(rows, key=lambda x: -x[3])
              ]

          if dev_only:
              print(
                  "::warning::%d High/Critical fixable vulnerability(ies) in DEV-ONLY dependencies "
                  "(not shipped; not blocking) — fix them on the normal upgrade cadence:" % len(dev_only)
              )
              for line in fmt(dev_only):
                  print(line)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("## \u26a0\ufe0f %d dev-only High/Critical advisory(ies)\n" % len(dev_only))
                      fh.write("Reachable only through devDependencies, so they never reach a deployed "
                               "artifact and do not block. Still worth clearing.\n\n")
                      for line in fmt(dev_only):
                          fh.write("-%s\n" % line[1:])

          if blocking:
              print("::error::%d High/Critical vulnerabilities WITH fixes available:" % len(blocking))
              for line in fmt(blocking):
                  print(line)
              sys.exit(1)

          print("OK: no shippable High/Critical fixable vulnerabilities. "
                "(Dev-only, lower-severity, and unfixable advisories above are informational.)")
          GATE_EOF
      - name: Run OSV-Scanner
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_LINUX_AMD64_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --version | grep -F "$OSV_VERSION"
          # Human-readable table in the log (never fails the step here)
          ./osv-scanner --recursive . || true
          # Machine-readable for the gate. Exit 1 means findings; any other
          # non-zero status is a scanner failure and must fail closed.
          set +e
          ./osv-scanner --recursive --format json . > osv.json
          OSV_STATUS=$?
          set -e
          if [ "$OSV_STATUS" -ne 0 ] && [ "$OSV_STATUS" -ne 1 ]; then
            echo "::error::OSV-Scanner failed with exit status $OSV_STATUS."
            exit "$OSV_STATUS"
          fi
          test -s osv.json || {
            echo "::error::OSV-Scanner produced no machine-readable result."
            exit 1
          }
          # Gate: fail on High/Critical (CVSS>=7) fixable vulns that can SHIP.
          # Dev-only npm findings are reported but do not block (see header).
          python3 .osv-gate.py
