name: security-scan

# Reusable org-wide security scan. Callers:
#   jobs.scan.uses: cognitum-one/.github/.github/workflows/security-scan.yml@<full-commit-sha>
#
# Secrets are scanned in TWO modes (ADR-092):
#   secrets               — CURRENT files only (--no-git), BLOCKING on every
#                           push/PR. Respects inline `gitleaks:allow` and the
#                           org allowlist; no historical-fixture noise.
#   secrets-history-audit — FULL history FINDINGS are informational, on the
#                           weekly schedule (and manual dispatch) only.
#                           Integrity, execution, and parse failures still block.
# OSV policy: every High/Critical vulnerability with a fix blocks. Candidate
#   lockfile `dev` flags are not trusted to downgrade findings.
# The sole database correction is GHSA-qwww-vcr4-c8h2 for react-router 7.18.2,
# which the maintainer identifies as patched while OSV still models as affected.
# It applies only to two reviewed repository/lockfile pairs, requires exact locked
# router + router-dom versions, an exact root dependency, and no RSC package,
# script, condition, import, or nested router surface. It expires 2026-08-15 UTC.
# Every mismatch or expiry fails closed. The scanner always uses a hash-verified
# organization config outside the candidate, disables candidate .gitignore
# filtering, and emits its report outside the candidate. The correction, scan
# wrapper, and their negative tests are fetched immutably and hash-verified.

on:
  workflow_call:
    secrets:
      static_ui_bridge_app_id:
        description: >-
          GitHub App ID used only to mint the website Beacon bridge token.
          Required only when the caller is cognitum-one/website.
        required: false
      static_ui_bridge_app_private_key:
        description: >-
          GitHub App private key used only by the pinned token-minting action.
          Required only when the caller is cognitum-one/website.
        required: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_CONFIG_COMMIT: "7c9325fd019aaa67d6f680b5ca9295f0ddb91c55"
  GITLEAKS_CONFIG_SHA256: "e6a9129918378cc14f34db402edc1fab2884581b9a9d3ff8dcf280bd4903d1e8"
  OSV_VERSION: "2.2.4"
  OSV_LINUX_AMD64_SHA256: "7702cd1e5d9f5059dd9570f4ad967f27d3c5f5391b371ec937b384c238177f55"
  OSV_POLICY_COMMIT: "fb5b8b0fced69718e31b41fe65f8d3c83f43b27d"
  OSV_GATE_SHA256: "669216fa6f6f106987e1d4e8ec6c3d5afd00c7a5cee364b90758960a8637d4ae"
  OSV_GATE_TEST_SHA256: "60cda6a8aa55f30745af42685a994ef9eede17ac3149df89b7f030f266fe913e"
  OSV_CONFIG_SHA256: "5bd10fc47448111e6d8bed4682b9b80e4c420ca6cb0808a252b8c6d8cd920c34"
  OSV_RUNNER_SHA256: "32ae0d4a9e3d1e461e91fc0fcbd9c3888928282bbd2371ab3ddfa9872ee409c1"
  OSV_RUNNER_TEST_SHA256: "c76a51f8bfceda09dfaa92bd479ca67a7ad893ca570a79ec5d3d2fb71d2bafdb"
  STATIC_UI_PROFILES_SHA256: "d820af8583c5f6e9040946cf8a3c947b2ac812062f1f744e38a7fc6449c36ee9"
  STATIC_UI_RECEIPT_SHA256: "b31a9d95a7547ab5471cf6901b878ccaf2e2abe5dca89f086b0f6e9f41e18b25"
  STATIC_UI_RECEIPT_TEST_SHA256: "4008cdf6540e208c75ccd563622c0a06672d84c509f7d0517bd6a3eac3c9a91e"

jobs:
  secrets:
    name: secret scan (current files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run gitleaks (current files, blocking)
        run: |
          set -euo pipefail
          # The candidate must not be able to replace its own security policy.
          # Fetch the independently reviewed organization config unconditionally,
          # pin it by commit and hash, and keep it outside the scan target.
          ORG_CONFIG="$RUNNER_TEMP/gitleaks.org.toml"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ORG_CONFIG" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${GITLEAKS_CONFIG_COMMIT}/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  ${ORG_CONFIG}" | sha256sum -c -
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          GITLEAKS_DIR="$RUNNER_TEMP/gitleaks-bin"
          install -d -m 0700 "$GITLEAKS_DIR"
          tar -xzf "$ARCHIVE" -C "$GITLEAKS_DIR" gitleaks
          GITLEAKS_BIN="$GITLEAKS_DIR/gitleaks"
          test -f "$GITLEAKS_BIN" && test ! -L "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" version | grep -F "$GITLEAKS_VERSION"
          # --no-git: scan the working tree (current files) only. Blocks new
          # secrets; ignores older commits (those are the history audit's job).
          "$GITLEAKS_BIN" detect --source . --no-git \
            --config "$ORG_CONFIG" --redact --exit-code 1

  secrets-history-audit:
    name: secret scan (full history audit)
    # Findings are informational; scanner integrity/execution failures block.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks (full history, informational)
        run: |
          set -euo pipefail
          ORG_CONFIG="$RUNNER_TEMP/gitleaks.org.toml"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ORG_CONFIG" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${GITLEAKS_CONFIG_COMMIT}/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  ${ORG_CONFIG}" | sha256sum -c -
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          GITLEAKS_DIR="$RUNNER_TEMP/gitleaks-bin"
          install -d -m 0700 "$GITLEAKS_DIR"
          tar -xzf "$ARCHIVE" -C "$GITLEAKS_DIR" gitleaks
          GITLEAKS_BIN="$GITLEAKS_DIR/gitleaks"
          test -f "$GITLEAKS_BIN" && test ! -L "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" version | grep -F "$GITLEAKS_VERSION"
          # Findings do not fail this job because exit-code is zero. Scanner
          # integrity, execution, and report-parse failures remain blocking.
          HISTORY_REPORT="$RUNNER_TEMP/gitleaks-history.json"
          "$GITLEAKS_BIN" detect --source . --config "$ORG_CONFIG" --redact \
            --report-format json --report-path "$HISTORY_REPORT" --exit-code 0
          n="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$HISTORY_REPORT")"
          if [ "$n" -gt 0 ]; then
            echo "::warning::Full-history audit found $n secret finding(s) in git history — review (not blocking; may be removed/rotated secrets)."
            {
              echo "## 🔎 Full-history secret audit — $n finding(s)"
              echo "These are in git *history* (removed/rotated or historical fixtures). Rotate anything real; allowlist confirmed non-secrets in gitleaks.toml."
              echo ""
              python3 -c "import json,sys;[print('- \`'+x.get('RuleID','?')+'\` '+x.get('File','?')+':'+str(x.get('StartLine','?'))+' @ '+x.get('Commit','')[:8]) for x in json.load(open(sys.argv[1]))[:50]]" "$HISTORY_REPORT" 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full-history audit: clean."
          fi

  deps:
    name: dependency scan (OSV, fail on High+ fixable)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and self-test the immutable organization OSV gate
        run: |
          set -euo pipefail
          # Candidate repositories cannot replace this policy or its tests.
          # The gate commit predates this workflow commit so the download is
          # independently addressable and hash-verifiable (no self-reference).
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          install -d -m 0700 "$POLICY_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/osv_gate.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/osv_gate.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_osv_gate.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/test_osv_gate.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/osv-scanner.toml" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/osv-scanner.toml"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/run_osv_scan.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/run_osv_scan.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_run_osv_scan.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/test_run_osv_scan.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/static-ui-runtime-profiles.json" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/static-ui-runtime-profiles.json"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/static_ui_runtime_receipt.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/static_ui_runtime_receipt.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_static_ui_runtime_receipt.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/test_static_ui_runtime_receipt.py"
          echo "${OSV_GATE_SHA256}  ${POLICY_DIR}/osv_gate.py" | sha256sum -c -
          echo "${OSV_GATE_TEST_SHA256}  ${POLICY_DIR}/test_osv_gate.py" | sha256sum -c -
          echo "${OSV_CONFIG_SHA256}  ${POLICY_DIR}/osv-scanner.toml" | sha256sum -c -
          echo "${OSV_RUNNER_SHA256}  ${POLICY_DIR}/run_osv_scan.py" | sha256sum -c -
          echo "${OSV_RUNNER_TEST_SHA256}  ${POLICY_DIR}/test_run_osv_scan.py" | sha256sum -c -
          echo "${STATIC_UI_PROFILES_SHA256}  ${POLICY_DIR}/static-ui-runtime-profiles.json" | sha256sum -c -
          echo "${STATIC_UI_RECEIPT_SHA256}  ${POLICY_DIR}/static_ui_runtime_receipt.py" | sha256sum -c -
          echo "${STATIC_UI_RECEIPT_TEST_SHA256}  ${POLICY_DIR}/test_static_ui_runtime_receipt.py" | sha256sum -c -
          python3 "$POLICY_DIR/test_osv_gate.py"
          python3 "$POLICY_DIR/test_run_osv_scan.py"
          python3 "$POLICY_DIR/test_static_ui_runtime_receipt.py"

      - name: Install the exact verified Buildx client
        if: >-
          ${{
            github.repository == 'cognitum-one/website' ||
            github.repository == 'cognitum-one/management'
          }}
        env:
          BUILDX_VERSION: "v0.33.0"
          BUILDX_REVISION: "f7897eba028583e0071642db3c011e860444f8cf"
          BUILDX_LINUX_AMD64_SHA256: "9426a15411f35f635afef3f5d3bae53155c3e30d26dee430cc968e13d34be49f"
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$RUNNER_TEMP/static-ui-docker-config"
          export DOCKER_CONFIG
          test ! -e "$DOCKER_CONFIG" && test ! -L "$DOCKER_CONFIG"
          install -d -m 0700 "$DOCKER_CONFIG"
          install -d -m 0700 "$DOCKER_CONFIG/cli-plugins"
          BUILDX_DOWNLOAD="$RUNNER_TEMP/buildx-v0.33.0.linux-amd64"
          test ! -e "$BUILDX_DOWNLOAD" && test ! -L "$BUILDX_DOWNLOAD"
          curl --proto '=https' --tlsv1.2 -fsSLo "$BUILDX_DOWNLOAD" \
            "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64"
          echo "${BUILDX_LINUX_AMD64_SHA256}  ${BUILDX_DOWNLOAD}" | sha256sum -c -
          BUILDX_PLUGIN="$DOCKER_CONFIG/cli-plugins/docker-buildx"
          install -m 0755 "$BUILDX_DOWNLOAD" "$BUILDX_PLUGIN"
          test -f "$BUILDX_PLUGIN" && test ! -L "$BUILDX_PLUGIN"
          EXPECTED_BUILDX="github.com/docker/buildx ${BUILDX_VERSION} ${BUILDX_REVISION}"
          test "$("$BUILDX_PLUGIN" version)" = "$EXPECTED_BUILDX"
          test "$(docker buildx version)" = "$EXPECTED_BUILDX"
          printf '%s\n' "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Set up the trusted Docker builder
        if: >-
          ${{
            github.repository == 'cognitum-one/website' ||
            github.repository == 'cognitum-one/management'
          }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
            network=bridge
          buildkitd-flags: --oci-worker-net=bridge

      - name: Mint the exact website and Beacon read token
        id: static-ui-bridge-token
        if: ${{ github.repository == 'cognitum-one/website' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.static_ui_bridge_app_id }}
          private-key: ${{ secrets.static_ui_bridge_app_private_key }}
          owner: cognitum-one
          repositories: |
            website
            beacon
          permission-contents: read

      - name: Checkout the exact Beacon submodule source outside the candidate
        id: beacon
        if: ${{ github.repository == 'cognitum-one/website' }}
        env:
          GH_TOKEN: ${{ steps.static-ui-bridge-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "::error::The website runtime proof requires its scoped GitHub App bridge token."
            exit 1
          }
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          BEACON_ROOT="$RUNNER_TEMP/static-ui-beacon"
          ASKPASS="$RUNNER_TEMP/static-ui-beacon-askpass.sh"
          test ! -e "$BEACON_ROOT"
          test ! -e "$ASKPASS"
          cleanup_beacon_credentials() {
            if [ -f "$ASKPASS" ]; then
              : > "$ASKPASS"
              rm -f "$ASKPASS"
            fi
          }
          trap cleanup_beacon_credentials EXIT
          BEACON_SHA="$(POLICY_DIR="$POLICY_DIR" python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          policy = json.loads(
              (Path(os.environ["POLICY_DIR"]) / "static-ui-runtime-profiles.json")
              .read_text(encoding="utf-8")
          )
          sha = policy["profiles"]["cognitum-one/website"]["submodules"]["beacon"]["commitSha"]
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid immutable Beacon commit in organization policy")
          print(sha)
          PY
          )"
          # The token is not persisted in Git config or a remote URL. Git invokes
          # this runner-temporary helper only when github.com asks for credentials.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GH_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 0700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= clone \
              --filter=blob:none --no-checkout \
              https://github.com/cognitum-one/beacon.git "$BEACON_ROOT"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git -C "$BEACON_ROOT" -c credential.helper= \
              fetch --depth=1 origin "$BEACON_SHA"
          # A partial clone can lazily fetch commit payloads during checkout, so
          # checkout must use the same ephemeral helper as clone and fetch.
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git -C "$BEACON_ROOT" -c credential.helper= \
              checkout --detach "$BEACON_SHA"
          test "$(git -C "$BEACON_ROOT" rev-parse HEAD)" = "$BEACON_SHA"
          echo "root=$BEACON_ROOT" >> "$GITHUB_OUTPUT"

      - name: Build and verify the committed static-UI runtime
        id: runtime
        if: >-
          ${{
            github.repository == 'cognitum-one/website' ||
            github.repository == 'cognitum-one/management'
          }}
        env:
          BEACON_ROOT: ${{ steps.beacon.outputs.root }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          STATIC_UI_BRIDGE_TOKEN: ${{ steps.static-ui-bridge-token.outputs.token }}
          STATIC_UI_MANAGEMENT_TOKEN: ${{ github.repository == 'cognitum-one/management' && github.token || '' }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_VISIBILITY" = "private"
          case "$GITHUB_REPOSITORY" in
            cognitum-one/website)
              STATIC_UI_IDENTITY_TOKEN="$STATIC_UI_BRIDGE_TOKEN"
              ;;
            cognitum-one/management)
              STATIC_UI_IDENTITY_TOKEN="$STATIC_UI_MANAGEMENT_TOKEN"
              ;;
            *)
              echo "::error::Static-UI runtime proof is not admitted for $GITHUB_REPOSITORY."
              exit 1
              ;;
          esac
          unset STATIC_UI_BRIDGE_TOKEN STATIC_UI_MANAGEMENT_TOKEN
          test -n "$STATIC_UI_IDENTITY_TOKEN"
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          NONCE_DIR="$RUNNER_TEMP/static-ui-runtime-nonce"
          OUTPUT_DIR="$RUNNER_TEMP/static-ui-runtime-evidence"
          install -d -m 0700 "$NONCE_DIR"
          umask 077
          openssl rand -hex 32 > "$NONCE_DIR/nonce"
          chmod 0600 "$NONCE_DIR/nonce"
          IMAGE_TAG="cognitum-static-ui/${GITHUB_REPOSITORY#*/}:${GITHUB_SHA}"
          arguments=(
            --policy "$POLICY_DIR/static-ui-runtime-profiles.json"
            build
            --repository "$GITHUB_REPOSITORY"
            --repository-root "$GITHUB_WORKSPACE"
            --source-sha "$GITHUB_SHA"
            --output-directory "$OUTPUT_DIR"
            --image-tag "$IMAGE_TAG"
            --receipt-nonce-file "$NONCE_DIR/nonce"
            --mode premerge
          )
          if [ "$GITHUB_REPOSITORY" = "cognitum-one/website" ]; then
            test -n "$BEACON_ROOT"
            arguments+=(--beacon-repository-root "$BEACON_ROOT")
          fi
          GH_TOKEN="$STATIC_UI_IDENTITY_TOKEN" \
          GITHUB_REPOSITORY_VISIBILITY="$REPOSITORY_VISIBILITY" \
            python3 "$POLICY_DIR/static_ui_runtime_receipt.py" "${arguments[@]}"
          rm -f -- "$OUTPUT_DIR/management-vite.env"
          IMAGE_ID="$(tr -d '\r\n' < "$OUTPUT_DIR/image-id.txt")"
          IMAGE_NAME="$(OUTPUT_DIR="$OUTPUT_DIR" python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["OUTPUT_DIR"]) / "static-ui-runtime-receipt.json")
              .read_text(encoding="utf-8")
          )
          name = receipt["subject"]["name"]
          if not isinstance(name, str) or not re.fullmatch(r"[a-z0-9./_-]+", name):
              raise SystemExit("invalid receipt image name")
          print(name)
          PY
          )"
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "receipt=$OUTPUT_DIR/static-ui-runtime-receipt.json"
            echo "inventory=$OUTPUT_DIR/rootfs-inventory.json"
            echo "nonce=$NONCE_DIR/nonce"
            echo "image_name=$IMAGE_NAME"
            echo "image_id=$IMAGE_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Run OSV-Scanner
        run: |
          set -euo pipefail
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          OSV_BIN="$POLICY_DIR/osv-scanner"
          OSV_REPORT="$RUNNER_TEMP/osv-report.json"
          curl --proto '=https' --tlsv1.2 -fsSLo "$OSV_BIN" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_LINUX_AMD64_SHA256}  ${OSV_BIN}" | sha256sum -c -
          chmod 0500 "$OSV_BIN"
          test -f "$OSV_BIN" && test ! -L "$OSV_BIN"
          "$OSV_BIN" --version | grep -F "$OSV_VERSION"
          python3 "$POLICY_DIR/run_osv_scan.py" \
            --binary "$OSV_BIN" \
            --config "$POLICY_DIR/osv-scanner.toml" \
            --report "$OSV_REPORT" \
            --repository-root "$GITHUB_WORKSPACE"
          # Gate: fail on High/Critical (CVSS>=7) fixable vulns that can SHIP.
          # The exact, expiring React Router 7.18.2 OSV range correction is
          # independently pinned organization policy; every other finding blocks.
          OSV_REPORT="$OSV_REPORT" \
          OSV_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
          OSV_RUNTIME_RECEIPT="${{ steps.runtime.outputs.receipt }}" \
          OSV_RUNTIME_INVENTORY="${{ steps.runtime.outputs.inventory }}" \
          OSV_RUNTIME_NONCE="${{ steps.runtime.outputs.nonce }}" \
          OSV_RUNTIME_IMAGE_NAME="${{ steps.runtime.outputs.image_name }}" \
          OSV_RUNTIME_IMAGE_ID="${{ steps.runtime.outputs.image_id }}" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_SHA="$GITHUB_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          GITHUB_JOB="$GITHUB_JOB" \
          GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
          GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            python3 "$POLICY_DIR/osv_gate.py"
