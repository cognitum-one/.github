jobs:
  # runs-on below: the gcp-bypass fleet exists to keep PRIVATE repos scanning
  # after the Actions billing stop (public repos were never metered, so they
  # never needed it). Every runner group in the org has
  # allows_public_repositories=false by design (cognitum-one/.github#83) --
  # routing a public caller (cogs, sdks) at the fleet is not a config knob,
  # it is a job GitHub refuses to schedule, and it fails silently: no runner
  # ever claims it, so the job sits queued until GitHub times it out cold,
  # with no error pointing at the cause. Public callers get GitHub-hosted
  # instead; private callers keep the fleet.
  secrets:
    name: secret scan (current files)
    outputs:
      findings: ${{ steps.findings.outputs.json }}
      completion: ${{ steps.findings.outputs.completion }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","gcp-bypass"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # The bypass fleet is PERSISTENT runners -- four per VM, reusing
      # _work/<repo>/<repo> between jobs. `actions/checkout` runs
      # `git clean -ffdx`, which does NOT remove submodule working trees:
      # submodules are TRACKED gitlinks, not untracked files. So a sibling job
      # that ran `git submodule update` leaves its content in the very tree
      # this job is about to scan.
      #
      # Measured on cognitum-one/console, 2026-08-20: a clean checkout is
      # 5.62 MB and scans clean; the reused workspace was 221.75 MB and
      # produced 29 findings, every one inside vendor/ruvector and none in
      # console. Throughout, `git status --porcelain` reported ZERO untracked
      # files -- which is why this needs a step rather than a comment. On
      # hosted runners it could not happen; every job got a fresh VM. That
      # assumption left with the hosted runners.
      - name: Purge anything a sibling job left in this workspace
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            git submodule deinit --all --force
          fi
          git clean -ffdx
          # Falsifiable, unlike `git status --porcelain` -- which passed while
          # 377 MB of third-party code sat in the tree. `git submodule status`
          # prefixes an emptied submodule with '-'; anything else means content
          # survived and the scan target is not this repository.
          if [ -f .gitmodules ] && git submodule status --recursive 2>/dev/null | grep -qv '^-'; then
            echo "::error::a submodule working tree survived the purge; refusing to scan a workspace that is not the repository"
            git submodule status --recursive
            exit 1
          fi
          echo "scan target: $(du -sh . | cut -f1) across $(git ls-files | wc -l) tracked files"
      - name: Run gitleaks (current files, blocking)
        id: findings
        run: |
          set -euo pipefail
          # The candidate must not be able to replace its own security policy.
          # Fetch the independently reviewed organization config unconditionally,
          # pin it by commit and hash, and keep it outside the scan target.
          ORG_CONFIG="$RUNNER_TEMP/gitleaks.org.toml"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ORG_CONFIG" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${GITLEAKS_CONFIG_COMMIT}/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  ${ORG_CONFIG}" | sha256sum -c -
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          GITLEAKS_DIR="$RUNNER_TEMP/gitleaks-bin"
          install -d -m 0700 "$GITLEAKS_DIR"
          tar -xzf "$ARCHIVE" -C "$GITLEAKS_DIR" gitleaks
          GITLEAKS_BIN="$GITLEAKS_DIR/gitleaks"
          test -f "$GITLEAKS_BIN" && test ! -L "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" version | grep -F "$GITLEAKS_VERSION"
          # --no-git: scan the working tree (current files) only. Blocks new
          # secrets; ignores older commits (those are the history audit's job).
          REPORT="$RUNNER_TEMP/gitleaks-current.json"
          "$GITLEAKS_BIN" detect --source . --no-git \
            --config "$ORG_CONFIG" --redact --report-format json \
            --report-path "$REPORT" --exit-code 0
          case "$GITHUB_WORKFLOW_REF" in
            cognitum-one/.github/.github/workflows/security-scan.yml@[0-9a-f][0-9a-f]*) POLICY_COMMIT="${GITHUB_WORKFLOW_REF##*@}" ;;
            *) echo "::error::SecurityPolicy/v1 scanner provenance is not immutable."; exit 1 ;;
          esac
          [[ "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          FINDINGS_TOOL="$RUNNER_TEMP/security_findings.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$FINDINGS_TOOL" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/security_findings.py"
          echo "${SECURITY_FINDINGS_SHA256}  ${FINDINGS_TOOL}" | sha256sum -c -
          FINDINGS="$(python3 "$FINDINGS_TOOL" --control secrets --report "$REPORT")"
          echo "json=$FINDINGS" >> "$GITHUB_OUTPUT"
          COMPLETION="$(FINDINGS="$FINDINGS" CONTROL=secrets POLICY_COMMIT="$POLICY_COMMIT" python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "schema": "security-producer-evidence-v1",
              "producer": "cognitum-one/.github/.github/workflows/security-scan.yml#" + os.environ["CONTROL"],
              "control": os.environ["CONTROL"], "source_sha": os.environ["GITHUB_SHA"],
              "workflow_sha": os.environ["POLICY_COMMIT"], "state": "completed",
              "findings": json.loads(os.environ["FINDINGS"]),
          }, separators=(",", ":")))
          PY
          )"
          echo "completion=$COMPLETION" >> "$GITHUB_OUTPUT"

  secrets-history-audit:
    name: secret scan (full history audit)
    # Findings are informational; scanner integrity/execution failures block.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","gcp-bypass"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      # The bypass fleet is PERSISTENT runners -- four per VM, reusing
      # _work/<repo>/<repo> between jobs. `actions/checkout` runs
      # `git clean -ffdx`, which does NOT remove submodule working trees:
      # submodules are TRACKED gitlinks, not untracked files. So a sibling job
      # that ran `git submodule update` leaves its content in the very tree
      # this job is about to scan.
      #
      # Measured on cognitum-one/console, 2026-08-20: a clean checkout is
      # 5.62 MB and scans clean; the reused workspace was 221.75 MB and
      # produced 29 findings, every one inside vendor/ruvector and none in
      # console. Throughout, `git status --porcelain` reported ZERO untracked
      # files -- which is why this needs a step rather than a comment. On
      # hosted runners it could not happen; every job got a fresh VM. That
      # assumption left with the hosted runners.
      - name: Purge anything a sibling job left in this workspace
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            git submodule deinit --all --force
          fi
          git clean -ffdx
          # Falsifiable, unlike `git status --porcelain` -- which passed while
          # 377 MB of third-party code sat in the tree. `git submodule status`
          # prefixes an emptied submodule with '-'; anything else means content
          # survived and the scan target is not this repository.
          if [ -f .gitmodules ] && git submodule status --recursive 2>/dev/null | grep -qv '^-'; then
            echo "::error::a submodule working tree survived the purge; refusing to scan a workspace that is not the repository"
            git submodule status --recursive
            exit 1
          fi
          echo "scan target: $(du -sh . | cut -f1) across $(git ls-files | wc -l) tracked files"
      - name: Run gitleaks (full history, informational)
        run: |
          set -euo pipefail
          ORG_CONFIG="$RUNNER_TEMP/gitleaks.org.toml"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ORG_CONFIG" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${GITLEAKS_CONFIG_COMMIT}/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  ${ORG_CONFIG}" | sha256sum -c -
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          GITLEAKS_DIR="$RUNNER_TEMP/gitleaks-bin"
          install -d -m 0700 "$GITLEAKS_DIR"
          tar -xzf "$ARCHIVE" -C "$GITLEAKS_DIR" gitleaks
          GITLEAKS_BIN="$GITLEAKS_DIR/gitleaks"
          test -f "$GITLEAKS_BIN" && test ! -L "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" version | grep -F "$GITLEAKS_VERSION"
          # Findings do not fail this job because exit-code is zero. Scanner
          # integrity, execution, and report-parse failures remain blocking.
          HISTORY_REPORT="$RUNNER_TEMP/gitleaks-history.json"
          "$GITLEAKS_BIN" detect --source . --config "$ORG_CONFIG" --redact \
            --report-format json --report-path "$HISTORY_REPORT" --exit-code 0
          n="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$HISTORY_REPORT")"
          if [ "$n" -gt 0 ]; then
            echo "::warning::Full-history audit found $n secret finding(s) in git history — review (not blocking; may be removed/rotated secrets)."
            {
              echo "## 🔎 Full-history secret audit — $n finding(s)"
              echo "These are in git *history* (removed/rotated or historical fixtures). Rotate anything real; allowlist confirmed non-secrets in gitleaks.toml."
              echo ""
              python3 -c "import json,sys;[print('- \`'+x.get('RuleID','?')+'\` '+x.get('File','?')+':'+str(x.get('StartLine','?'))+' @ '+x.get('Commit','')[:8]) for x in json.load(open(sys.argv[1]))[:50]]" "$HISTORY_REPORT" 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full-history audit: clean."
          fi

  workflow-pins:
    name: workflow supply-chain policy
    outputs:
      findings: ${{ steps.findings.outputs.json }}
      completion: ${{ steps.findings.outputs.completion }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","gcp-bypass"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Fetch and self-test the immutable workflow pin policy
        run: |
          set -euo pipefail
          POLICY_DIR="$RUNNER_TEMP/workflow-pin-policy"
          install -d -m 0700 "$POLICY_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/verify_workflow_pins.mjs" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${ENFORCEMENT_POLICY_COMMIT}/security/verify_workflow_pins.mjs"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_verify_workflow_pins.mjs" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${ENFORCEMENT_POLICY_COMMIT}/security/test_verify_workflow_pins.mjs"
          echo "${WORKFLOW_PIN_POLICY_SHA256}  ${POLICY_DIR}/verify_workflow_pins.mjs" | sha256sum -c -
          echo "${WORKFLOW_PIN_POLICY_TEST_SHA256}  ${POLICY_DIR}/test_verify_workflow_pins.mjs" | sha256sum -c -
          node --test "$POLICY_DIR/test_verify_workflow_pins.mjs"

      - name: Normalize workflow supply-chain findings before enforcing
        id: findings
        run: |
          set -euo pipefail
          FINDINGS_VERIFIER="$RUNNER_TEMP/verify_workflow_pins.mjs"
          case "$GITHUB_WORKFLOW_REF" in
            cognitum-one/.github/.github/workflows/security-scan.yml@[0-9a-f][0-9a-f]*) POLICY_COMMIT="${GITHUB_WORKFLOW_REF##*@}" ;;
            *) echo "::error::SecurityPolicy/v1 scanner provenance is not immutable."; exit 1 ;;
          esac
          [[ "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          FINDINGS_TOOL="$RUNNER_TEMP/security_findings.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$FINDINGS_VERIFIER" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/verify_workflow_pins.mjs"
          curl --proto '=https' --tlsv1.2 -fsSLo "$FINDINGS_TOOL" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/security_findings.py"
          echo "${SECURITY_WORKFLOW_FINDINGS_SHA256}  ${FINDINGS_VERIFIER}" | sha256sum -c -
          echo "${SECURITY_FINDINGS_SHA256}  ${FINDINGS_TOOL}" | sha256sum -c -
          node "$FINDINGS_VERIFIER" --findings-json "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/workflow-pin-findings.json"
          FINDINGS="$(python3 "$FINDINGS_TOOL" --control workflow_pins --report "$RUNNER_TEMP/workflow-pin-findings.json")"
          echo "json=$FINDINGS" >> "$GITHUB_OUTPUT"
          COMPLETION="$(FINDINGS="$FINDINGS" CONTROL=workflow_pins POLICY_COMMIT="$POLICY_COMMIT" python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "schema": "security-producer-evidence-v1",
              "producer": "cognitum-one/.github/.github/workflows/security-scan.yml#" + os.environ["CONTROL"],
              "control": os.environ["CONTROL"], "source_sha": os.environ["GITHUB_SHA"],
              "workflow_sha": os.environ["POLICY_COMMIT"], "state": "completed",
              "findings": json.loads(os.environ["FINDINGS"]),
          }, separators=(",", ":")))
          PY
          )"
          echo "completion=$COMPLETION" >> "$GITHUB_OUTPUT"

  deps:
    name: dependency scan (OSV, fail on High+ fixable)
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","gcp-bypass"]') }}
    outputs:
      findings: ${{ steps.findings.outputs.json }}
      completion: ${{ steps.findings.outputs.completion }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      # The bypass fleet is PERSISTENT runners -- four per VM, reusing
      # _work/<repo>/<repo> between jobs. `actions/checkout` runs
      # `git clean -ffdx`, which does NOT remove submodule working trees:
      # submodules are TRACKED gitlinks, not untracked files. So a sibling job
      # that ran `git submodule update` leaves its content in the very tree
      # this job is about to scan.
      #
      # Measured on cognitum-one/console, 2026-08-20: a clean checkout is
      # 5.62 MB and scans clean; the reused workspace was 221.75 MB and
      # produced 29 findings, every one inside vendor/ruvector and none in
      # console. Throughout, `git status --porcelain` reported ZERO untracked
      # files -- which is why this needs a step rather than a comment. On
      # hosted runners it could not happen; every job got a fresh VM. That
      # assumption left with the hosted runners.
      - name: Purge anything a sibling job left in this workspace
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            git submodule deinit --all --force
          fi
          git clean -ffdx
          # Falsifiable, unlike `git status --porcelain` -- which passed while
          # 377 MB of third-party code sat in the tree. `git submodule status`
          # prefixes an emptied submodule with '-'; anything else means content
          # survived and the scan target is not this repository.
          if [ -f .gitmodules ] && git submodule status --recursive 2>/dev/null | grep -qv '^-'; then
            echo "::error::a submodule working tree survived the purge; refusing to scan a workspace that is not the repository"
            git submodule status --recursive
            exit 1
          fi
          echo "scan target: $(du -sh . | cut -f1) across $(git ls-files | wc -l) tracked files"
      - name: Fetch and self-test the immutable organization OSV gate
        run: |
          set -euo pipefail
          # Candidate repositories cannot replace this policy or its tests.
          # The gate commit predates this workflow commit so the download is
          # independently addressable and hash-verifiable (no self-reference).
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          install -d -m 0700 "$POLICY_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/osv_gate.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/osv_gate.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_osv_gate.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/test_osv_gate.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/osv-scanner.toml" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/osv-scanner.toml"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/run_osv_scan.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/run_osv_scan.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_run_osv_scan.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/test_run_osv_scan.py"
          # Fixture for the organization self-test below ONLY. Enforcement reads
          # the candidate repository's own .github/static-ui-profile.json, so a
          # Dockerfile or lockfile change no longer needs a PR to this repo.
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/static-ui-runtime-profiles.json" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/static-ui-runtime-profiles.json"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/static_ui_runtime_receipt.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/static_ui_runtime_receipt.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_static_ui_runtime_receipt.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${OSV_POLICY_COMMIT}/security/test_static_ui_runtime_receipt.py"
          echo "${OSV_GATE_SHA256}  ${POLICY_DIR}/osv_gate.py" | sha256sum -c -
          echo "${OSV_GATE_TEST_SHA256}  ${POLICY_DIR}/test_osv_gate.py" | sha256sum -c -
          echo "${OSV_CONFIG_SHA256}  ${POLICY_DIR}/osv-scanner.toml" | sha256sum -c -
          echo "${OSV_RUNNER_SHA256}  ${POLICY_DIR}/run_osv_scan.py" | sha256sum -c -
          echo "${OSV_RUNNER_TEST_SHA256}  ${POLICY_DIR}/test_run_osv_scan.py" | sha256sum -c -
          echo "${STATIC_UI_PROFILES_SHA256}  ${POLICY_DIR}/static-ui-runtime-profiles.json" | sha256sum -c -
          echo "${STATIC_UI_RECEIPT_SHA256}  ${POLICY_DIR}/static_ui_runtime_receipt.py" | sha256sum -c -
          echo "${STATIC_UI_RECEIPT_TEST_SHA256}  ${POLICY_DIR}/test_static_ui_runtime_receipt.py" | sha256sum -c -
          python3 "$POLICY_DIR/test_osv_gate.py"
          python3 "$POLICY_DIR/test_run_osv_scan.py"
          python3 "$POLICY_DIR/test_static_ui_runtime_receipt.py"

      - name: Install the exact verified Buildx client
        if: >-
          ${{
            github.repository == 'cognitum-one/website' ||
            github.repository == 'cognitum-one/management'
          }}
        env:
          BUILDX_VERSION: "v0.33.0"
          BUILDX_REVISION: "f7897eba028583e0071642db3c011e860444f8cf"
          BUILDX_LINUX_AMD64_SHA256: "9426a15411f35f635afef3f5d3bae53155c3e30d26dee430cc968e13d34be49f"
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$RUNNER_TEMP/static-ui-docker-config"
          export DOCKER_CONFIG
          test ! -e "$DOCKER_CONFIG" && test ! -L "$DOCKER_CONFIG"
          install -d -m 0700 "$DOCKER_CONFIG"
          install -d -m 0700 "$DOCKER_CONFIG/cli-plugins"
          BUILDX_DOWNLOAD="$RUNNER_TEMP/buildx-v0.33.0.linux-amd64"
          test ! -e "$BUILDX_DOWNLOAD" && test ! -L "$BUILDX_DOWNLOAD"
          curl --proto '=https' --tlsv1.2 -fsSLo "$BUILDX_DOWNLOAD" \
            "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64"
          echo "${BUILDX_LINUX_AMD64_SHA256}  ${BUILDX_DOWNLOAD}" | sha256sum -c -
          BUILDX_PLUGIN="$DOCKER_CONFIG/cli-plugins/docker-buildx"
          install -m 0755 "$BUILDX_DOWNLOAD" "$BUILDX_PLUGIN"
          test -f "$BUILDX_PLUGIN" && test ! -L "$BUILDX_PLUGIN"
          EXPECTED_BUILDX="github.com/docker/buildx ${BUILDX_VERSION} ${BUILDX_REVISION}"
          test "$("$BUILDX_PLUGIN" version)" = "$EXPECTED_BUILDX"
          test "$(docker buildx version)" = "$EXPECTED_BUILDX"
          printf '%s\n' "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Set up the trusted Docker builder
        if: >-
          ${{
            github.repository == 'cognitum-one/website' ||
            github.repository == 'cognitum-one/management'
          }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
            network=bridge
          buildkitd-flags: --oci-worker-net=bridge

      - name: Mint the exact website and Beacon read token
        id: static-ui-bridge-token
        if: ${{ github.repository == 'cognitum-one/website' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.static_ui_bridge_app_id }}
          private-key: ${{ secrets.static_ui_bridge_app_private_key }}
          owner: cognitum-one
          repositories: |
            website
            beacon
          permission-contents: read

      - name: Checkout the exact Beacon submodule source outside the candidate
        id: beacon
        if: ${{ github.repository == 'cognitum-one/website' }}
        env:
          GH_TOKEN: ${{ steps.static-ui-bridge-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "::error::The website runtime proof requires its scoped GitHub App bridge token."
            exit 1
          }
          BEACON_ROOT="$RUNNER_TEMP/static-ui-beacon"
          ASKPASS="$RUNNER_TEMP/static-ui-beacon-askpass.sh"
          test ! -e "$BEACON_ROOT"
          test ! -e "$ASKPASS"
          cleanup_beacon_credentials() {
            if [ -f "$ASKPASS" ]; then
              : > "$ASKPASS"
              rm -f "$ASKPASS"
            fi
          }
          trap cleanup_beacon_credentials EXIT
          # The candidate repository owns this file. The enforcement SCRIPT above
          # stays organization-owned and hash-verified, so a repository can change
          # WHAT it declares but never HOW the declaration is enforced.
          STATIC_UI_PROFILE="$GITHUB_WORKSPACE/.github/static-ui-profile.json"
          test -f "$STATIC_UI_PROFILE"
          test ! -L "$STATIC_UI_PROFILE"
          BEACON_SHA="$(STATIC_UI_PROFILE="$STATIC_UI_PROFILE" python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          policy = json.loads(
              Path(os.environ["STATIC_UI_PROFILE"]).read_text(encoding="utf-8")
          )
          sha = policy["profiles"]["cognitum-one/website"]["submodules"]["beacon"]["commitSha"]
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid immutable Beacon commit in organization policy")
          print(sha)
          PY
          )"
          # The token is not persisted in Git config or a remote URL. Git invokes
          # this runner-temporary helper only when github.com asks for credentials.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GH_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 0700 "$ASKPASS"
          # Bounded retry (cognitum-one/website#285). This fetch intermittently
          # fails with `remote: Repository not found` and then succeeds on a
          # re-run with NO change to the token, the App, or the installation —
          # measured again on 2026-08-18, where a re-run of the identical job
          # passed. Every beacon-affecting release paid for that with a manual
          # re-dispatch, and the error reads like a broken installation.
          #
          # #285 attributes it to an EMPTY minted token. That is not what
          # happens here: `test -n "$GH_TOKEN"` above already passed, so the
          # token was present and the 404 came back for a non-empty credential.
          # The remaining explanation is eventual consistency in the scoping of
          # a freshly minted installation token, which a short backoff clears
          # and a re-mint would not.
          #
          # So the retry is the mitigation, and the probe below is the
          # experiment: on a genuine exhaustion it reports whether the token can
          # see the repository at all, which separates "transient propagation"
          # from "the installation really lost beacon" without another guess.
          fetch_beacon_source() {
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
              git -c credential.helper= clone \
                --filter=blob:none --no-checkout \
                https://github.com/cognitum-one/beacon.git "$BEACON_ROOT" || return 1
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
              git -C "$BEACON_ROOT" -c credential.helper= \
                fetch --depth=1 origin "$BEACON_SHA" || return 1
            # A partial clone can lazily fetch commit payloads during checkout, so
            # checkout must use the same ephemeral helper as clone and fetch.
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
              git -C "$BEACON_ROOT" -c credential.helper= \
                checkout --detach "$BEACON_SHA" || return 1
          }
          beacon_attempt=1
          beacon_max=3
          until fetch_beacon_source; do
            if [ "$beacon_attempt" -ge "$beacon_max" ]; then
              echo "::error::Beacon source fetch failed after $beacon_max attempts."
              probe="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/cognitum-one/beacon || echo 000)"
              echo "::error::Token visibility probe for cognitum-one/beacon: HTTP $probe. 200 means the minted token CAN see the repository, so the failure was transient and the retry budget was too small; 404 means this token is genuinely not scoped to beacon and the App installation needs fixing."
              exit 1
            fi
            # A failed clone can leave a partial directory, which makes the next
            # attempt fail for a different reason than the one being retried.
            rm -rf "$BEACON_ROOT"
            echo "Beacon source fetch attempt $beacon_attempt failed; retrying in $((beacon_attempt * 5))s"
            sleep "$((beacon_attempt * 5))"
            beacon_attempt=$((beacon_attempt + 1))
          done
          test "$(git -C "$BEACON_ROOT" rev-parse HEAD)" = "$BEACON_SHA"
          echo "root=$BEACON_ROOT" >> "$GITHUB_OUTPUT"

      - name: Build and verify the committed static-UI runtime
        id: runtime
        if: >-
          ${{
            github.repository == 'cognitum-one/website' ||
            github.repository == 'cognitum-one/management'
          }}
        env:
          BEACON_ROOT: ${{ steps.beacon.outputs.root }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          STATIC_UI_BRIDGE_TOKEN: ${{ steps.static-ui-bridge-token.outputs.token }}
          STATIC_UI_MANAGEMENT_TOKEN: ${{ github.repository == 'cognitum-one/management' && github.token || '' }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_VISIBILITY" = "private"
          case "$GITHUB_REPOSITORY" in
            cognitum-one/website)
              STATIC_UI_IDENTITY_TOKEN="$STATIC_UI_BRIDGE_TOKEN"
              ;;
            cognitum-one/management)
              STATIC_UI_IDENTITY_TOKEN="$STATIC_UI_MANAGEMENT_TOKEN"
              ;;
            *)
              echo "::error::Static-UI runtime proof is not admitted for $GITHUB_REPOSITORY."
              exit 1
              ;;
          esac
          unset STATIC_UI_BRIDGE_TOKEN STATIC_UI_MANAGEMENT_TOKEN
          test -n "$STATIC_UI_IDENTITY_TOKEN"
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          NONCE_DIR="$RUNNER_TEMP/static-ui-runtime-nonce"
          OUTPUT_DIR="$RUNNER_TEMP/static-ui-runtime-evidence"
          install -d -m 0700 "$NONCE_DIR"
          umask 077
          openssl rand -hex 32 > "$NONCE_DIR/nonce"
          chmod 0600 "$NONCE_DIR/nonce"
          # The candidate repository owns this file. The enforcement SCRIPT above
          # stays organization-owned and hash-verified, so a repository can change
          # WHAT it declares but never HOW the declaration is enforced.
          STATIC_UI_PROFILE="$GITHUB_WORKSPACE/.github/static-ui-profile.json"
          test -f "$STATIC_UI_PROFILE"
          test ! -L "$STATIC_UI_PROFILE"
          IMAGE_TAG="cognitum-static-ui/${GITHUB_REPOSITORY#*/}:${GITHUB_SHA}"
          arguments=(
            --policy "$STATIC_UI_PROFILE"
            build
            --repository "$GITHUB_REPOSITORY"
            --repository-root "$GITHUB_WORKSPACE"
            --source-sha "$GITHUB_SHA"
            --output-directory "$OUTPUT_DIR"
            --image-tag "$IMAGE_TAG"
            --receipt-nonce-file "$NONCE_DIR/nonce"
            --mode premerge
          )
          if [ "$GITHUB_REPOSITORY" = "cognitum-one/website" ]; then
            test -n "$BEACON_ROOT"
            arguments+=(--beacon-repository-root "$BEACON_ROOT")
          fi
          GH_TOKEN="$STATIC_UI_IDENTITY_TOKEN" \
          GITHUB_REPOSITORY_VISIBILITY="$REPOSITORY_VISIBILITY" \
            python3 "$POLICY_DIR/static_ui_runtime_receipt.py" "${arguments[@]}"
          rm -f -- "$OUTPUT_DIR/management-vite.env"
          IMAGE_ID="$(tr -d '\r\n' < "$OUTPUT_DIR/image-id.txt")"
          IMAGE_NAME="$(OUTPUT_DIR="$OUTPUT_DIR" python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["OUTPUT_DIR"]) / "static-ui-runtime-receipt.json")
              .read_text(encoding="utf-8")
          )
          name = receipt["subject"]["name"]
          if not isinstance(name, str) or not re.fullmatch(r"[a-z0-9./_-]+", name):
              raise SystemExit("invalid receipt image name")
          print(name)
          PY
          )"
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "receipt=$OUTPUT_DIR/static-ui-runtime-receipt.json"
            echo "inventory=$OUTPUT_DIR/rootfs-inventory.json"
            echo "nonce=$NONCE_DIR/nonce"
            echo "image_name=$IMAGE_NAME"
            echo "image_id=$IMAGE_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Run OSV-Scanner
        run: |
          set -euo pipefail
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          # Re-verify the receipt against the SAME profile it was built from --
          # the candidate's own. Without this the gate loads the copy beside the
          # script and rejects a self-consistent repository with "premerge
          # fixture evidence differs from the profile". Repositories with no
          # profile leave this unset and the gate keeps its previous default.
          if [ -f "$GITHUB_WORKSPACE/.github/static-ui-profile.json" ] \
            && [ ! -L "$GITHUB_WORKSPACE/.github/static-ui-profile.json" ]; then
            export STATIC_UI_POLICY_PATH="$GITHUB_WORKSPACE/.github/static-ui-profile.json"
          fi
          OSV_BIN="$POLICY_DIR/osv-scanner"
          OSV_REPORT="$RUNNER_TEMP/osv-report.json"
          curl --proto '=https' --tlsv1.2 -fsSLo "$OSV_BIN" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_LINUX_AMD64_SHA256}  ${OSV_BIN}" | sha256sum -c -
          chmod 0500 "$OSV_BIN"
          test -f "$OSV_BIN" && test ! -L "$OSV_BIN"
          "$OSV_BIN" --version | grep -F "$OSV_VERSION"
          python3 "$POLICY_DIR/run_osv_scan.py" \
            --binary "$OSV_BIN" \
            --config "$POLICY_DIR/osv-scanner.toml" \
            --report "$OSV_REPORT" \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Normalize dependency findings before enforcing
        id: findings
        run: |
          set -euo pipefail
          case "$GITHUB_WORKFLOW_REF" in
            cognitum-one/.github/.github/workflows/security-scan.yml@[0-9a-f][0-9a-f]*) POLICY_COMMIT="${GITHUB_WORKFLOW_REF##*@}" ;;
            *) echo "::error::SecurityPolicy/v1 scanner provenance is not immutable."; exit 1 ;;
          esac
          [[ "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          FINDINGS_TOOL="$RUNNER_TEMP/security_findings.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$FINDINGS_TOOL" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/security_findings.py"
          echo "${SECURITY_FINDINGS_SHA256}  ${FINDINGS_TOOL}" | sha256sum -c -
          FINDINGS="$(python3 "$FINDINGS_TOOL" --control dependencies --report "$RUNNER_TEMP/osv-report.json" --repository-root "$GITHUB_WORKSPACE")"
          echo "json=$FINDINGS" >> "$GITHUB_OUTPUT"
          COMPLETION="$(FINDINGS="$FINDINGS" CONTROL=dependencies POLICY_COMMIT="$POLICY_COMMIT" python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "schema": "security-producer-evidence-v1",
              "producer": "cognitum-one/.github/.github/workflows/security-scan.yml#" + os.environ["CONTROL"],
              "control": os.environ["CONTROL"], "source_sha": os.environ["GITHUB_SHA"],
              "workflow_sha": os.environ["POLICY_COMMIT"], "state": "completed",
              "findings": json.loads(os.environ["FINDINGS"]),
          }, separators=(",", ":")))
          PY
          )"
          echo "completion=$COMPLETION" >> "$GITHUB_OUTPUT"

      - name: Enforce OSV dependency policy
        run: |
          set -euo pipefail
          POLICY_DIR="$RUNNER_TEMP/osv-policy"
          OSV_REPORT="$RUNNER_TEMP/osv-report.json"
          # Gate: fail on High/Critical (CVSS>=7) fixable vulns that can SHIP.
          # The exact, expiring React Router 7.18.2 OSV range correction is
          # independently pinned organization policy; every other finding blocks.
          set +e
          OSV_REPORT="$OSV_REPORT" \
          OSV_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
          OSV_RUNTIME_RECEIPT="${{ steps.runtime.outputs.receipt }}" \
          OSV_RUNTIME_INVENTORY="${{ steps.runtime.outputs.inventory }}" \
          OSV_RUNTIME_NONCE="${{ steps.runtime.outputs.nonce }}" \
          OSV_RUNTIME_IMAGE_NAME="${{ steps.runtime.outputs.image_name }}" \
          OSV_RUNTIME_IMAGE_ID="${{ steps.runtime.outputs.image_id }}" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_SHA="$GITHUB_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          GITHUB_JOB="$GITHUB_JOB" \
          GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
          GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            python3 "$POLICY_DIR/osv_gate.py"
          gate_status=$?
          set -e
          if [ "$gate_status" -eq 1 ]; then
            # Exit 1 is the gate's documented finding verdict. The central
            # policy owns whether this completed finding blocks a profile.
            test "${{ steps.findings.outputs.json }}" != '[]'
          elif [ "$gate_status" -ne 0 ]; then
            # Exit 2 is malformed report/runtime receipt/nonce/image evidence
            # or another execution-integrity fault: never reinterpret it as a
            # finding merely because the report happens to be nonempty.
            exit "$gate_status"
          fi

  enforcement:
    name: enforcement
    if: ${{ always() }}
    needs: [secrets, secrets-history-audit, workflow-pins, deps]
    outputs:
      evidence: ${{ steps.policy.outputs.evidence }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","gcp-bypass"]') }}
    steps:
      - name: Evaluate immutable SecurityPolicy/v1 and write evidence receipt
        id: policy
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          HISTORY_RESULT: ${{ needs.secrets-history-audit.result }}
          WORKFLOW_PINS_RESULT: ${{ needs.workflow-pins.result }}
          DEPENDENCIES_RESULT: ${{ needs.deps.result }}
          SECRETS_FINDINGS: ${{ needs.secrets.outputs.findings }}
          WORKFLOW_PINS_FINDINGS: ${{ needs.workflow-pins.outputs.findings }}
          DEPENDENCIES_FINDINGS: ${{ needs.deps.outputs.findings }}
          SECRETS_COMPLETION: ${{ needs.secrets.outputs.completion }}
          WORKFLOW_PINS_COMPLETION: ${{ needs.workflow-pins.outputs.completion }}
          DEPENDENCIES_COMPLETION: ${{ needs.deps.outputs.completion }}
        run: |
          set -euo pipefail
          case "$GITHUB_WORKFLOW_REF" in
            cognitum-one/.github/.github/workflows/security-scan.yml@[0-9a-f][0-9a-f]*)
              POLICY_COMMIT="${GITHUB_WORKFLOW_REF##*@}"
              ;;
            *)
              echo "::error::SecurityPolicy/v1 requires this reusable workflow to be full-SHA pinned."
              exit 1
              ;;
          esac
          [[ "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          POLICY_DIR="$RUNNER_TEMP/security-policy-v1"
          install -d -m 0700 "$POLICY_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/security-policy-v1.json" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/security-policy-v1.json"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/security_policy.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/security_policy.py"
          curl --proto '=https' --tlsv1.2 -fsSLo "$POLICY_DIR/test_security_policy.py" \
            "https://raw.githubusercontent.com/cognitum-one/.github/${POLICY_COMMIT}/security/test_security_policy.py"
          echo "${SECURITY_POLICY_SHA256}  ${POLICY_DIR}/security-policy-v1.json" | sha256sum -c -
          echo "${SECURITY_POLICY_SCRIPT_SHA256}  ${POLICY_DIR}/security_policy.py" | sha256sum -c -
          echo "${SECURITY_POLICY_TEST_SHA256}  ${POLICY_DIR}/test_security_policy.py" | sha256sum -c -
          python3 "$POLICY_DIR/test_security_policy.py"
          expected_history=skipped
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            expected_history=success
          fi
          test "$HISTORY_RESULT" = "$expected_history"
          RECEIPT="$RUNNER_TEMP/security-evidence-v1.json"
          echo "receipt=$RECEIPT" >> "$GITHUB_OUTPUT"
          python3 "$POLICY_DIR/security_policy.py" \
            --policy "$POLICY_DIR/security-policy-v1.json" \
            --policy-sha256 "$SECURITY_POLICY_SHA256" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-sha "$POLICY_COMMIT" \
            --producer cognitum-one/.github/.github/workflows/security-scan.yml \
            --results "{\"secrets\":\"$SECRETS_RESULT\",\"dependencies\":\"$DEPENDENCIES_RESULT\",\"workflow_pins\":\"$WORKFLOW_PINS_RESULT\"}" \
            --findings "{\"secrets\":${SECRETS_FINDINGS:-null},\"dependencies\":${DEPENDENCIES_FINDINGS:-null},\"workflow_pins\":${WORKFLOW_PINS_FINDINGS:-null}}" \
            --completions "{\"secrets\":${SECRETS_COMPLETION:-null},\"dependencies\":${DEPENDENCIES_COMPLETION:-null},\"workflow_pins\":${WORKFLOW_PINS_COMPLETION:-null}}" \
            --output "$RECEIPT"
          POLICY_OUTPUT="$(RECEIPT="$RECEIPT" python3 - <<'PY'
          import json
          import os
          receipt = json.load(open(os.environ["RECEIPT"], encoding="utf-8"))
          for name in ("policy_revision", "repository_id", "source_sha", "workflow_sha", "verdict"):
              print(f"{name}={receipt[name]}")
          PY
          )"
          printf '%s\n' "$POLICY_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "evidence=$(base64 < "$RECEIPT" | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload SecurityPolicy/v1 machine-readable evidence
        if: ${{ always() && steps.policy.outputs.receipt != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-evidence-v1
          path: ${{ steps.policy.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30
