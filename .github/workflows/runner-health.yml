name: runner fleet health

# Nothing watches the self-hosted runner VMs. The Cloud Ops agent is inactive
# and cannot be enabled without giving these VMs a service account, which they
# deliberately do not have -- they reach GCP through WIF from the GitHub OIDC
# token, never from VM-attached credentials, and that property is worth more
# than agent metrics.
#
# So the fleet reports on ITSELF, from inside jobs that run on it. That is the
# one vantage point which needs no credential and no extra IAM.
#
# Why this exists: on 2026-08-21 gha-runner-1 filled to 100% (388K free). It
# killed a CI job at Swatinem/rust-cache and the log could not even be uploaded
# (BlobNotFound), so the failure presented as an unexplained red X. Nobody knew
# the disk was full until someone went looking. Two lanes now build Rust images
# on these VMs, so the pressure is structural, not a one-off.
#
# Remediation is already automatic and local: gha-docker-gc.timer prunes docker
# under pressure, and the runner units carry Restart=always. This workflow does
# not fix anything -- it makes a fleet that is quietly degrading VISIBLE, and it
# verifies those two controls are actually live rather than merely installed.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bypass:
    name: bypass VM health ${{ matrix.probe }}
    strategy:
      fail-fast: false
      # NINE probes, not three. Runner assignment cannot be steered, but each
      # bypass VM hosts at most four runner processes, so nine concurrent jobs
      # must span at least ceil(9/4) = 3 VMs -- which is the whole fleet.
      # Fewer probes could sample the same VM repeatedly and report a green
      # fleet while a different VM was full. Each probe takes seconds, and
      # self-hosted minutes are not billed.
      matrix:
        probe: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    runs-on: [self-hosted, gcp-bypass]
    timeout-minutes: 5
    steps:
      - name: Report this VM and fail if it is degraded
        shell: bash
        run: |
          set -uo pipefail
          HOST="$(hostname -s)"
          USED="$(df --output=pcent / | tail -1 | tr -dc '0-9')"
          AVAIL="$(df -h --output=avail / | tail -1 | tr -d ' ')"
          echo "### $HOST — ${USED}% used, ${AVAIL} free" >> "$GITHUB_STEP_SUMMARY"

          fail=0
          warn=0

          # DISK. 90 is the hard line: below it the local GC still has room to
          # work, above it a job can die mid-step and lose its own log.
          if [ "$USED" -ge 90 ]; then
            echo "::error::$HOST disk ${USED}% (${AVAIL} free) — jobs will start dying"; fail=1
          elif [ "$USED" -ge 80 ]; then
            echo "::warning::$HOST disk ${USED}% (${AVAIL} free) — above the GC trigger"; warn=1
          fi

          # THE GC ITSELF. An installed-but-dead timer looks identical to a
          # working one from the outside, which is the failure mode this whole
          # workflow exists to break.
          if [ "$(systemctl is-active gha-docker-gc.timer 2>/dev/null)" != "active" ]; then
            echo "::error::$HOST gha-docker-gc.timer is NOT active — nothing is reclaiming disk"; fail=1
          fi

          # EVERY runner process on this VM, not just the one executing this
          # job. A sibling that has silently died is exactly what a health check
          # from the outside cannot see.
          units="$(systemctl list-units 'actions.runner*' --no-pager --plain --no-legend 2>/dev/null | awk '{print $1}')"
          if [ -z "$units" ]; then
            echo "::error::$HOST has no actions.runner units at all"; fail=1
          fi
          for u in $units; do
            state="$(systemctl is-active "$u" 2>/dev/null)"
            restart="$(systemctl show -p Restart --value "$u" 2>/dev/null)"
            printf -- '- %s: %s (Restart=%s)\n' "$u" "$state" "$restart" >> "$GITHUB_STEP_SUMMARY"
            [ "$state" = active ] || { echo "::error::$HOST $u is $state"; fail=1; }
            # Without Restart=always a crashed runner never comes back and the
            # pool silently shrinks. Shipped units have no Restart= at all.
            [ "$restart" = always ] || { echo "::warning::$HOST $u has Restart=$restart, not always"; warn=1; }
          done

          {
            echo ""
            echo "docker: $(docker system df --format '{{.Type}}={{.Size}}' 2>/dev/null | tr '\n' ' ')"
            echo "last gc: $(journalctl -t gha-docker-gc -n 1 --no-pager -o cat 2>/dev/null || echo 'no entries')"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$fail" -eq 0 ] || exit 1
          [ "$warn" -eq 0 ] && echo "$HOST healthy" >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # The single-runner pools. One probe each is full coverage: one VM, one pool.
  dedicated:
    name: ${{ matrix.pool }} VM health
    strategy:
      fail-fast: false
      matrix:
        pool: [gcp-identity-deploy, management-attestation]
    runs-on: [self-hosted, "${{ matrix.pool }}"]
    timeout-minutes: 5
    steps:
      - name: Report this VM and fail if it is degraded
        shell: bash
        run: |
          set -uo pipefail
          HOST="$(hostname -s)"
          USED="$(df --output=pcent / | tail -1 | tr -dc '0-9')"
          AVAIL="$(df -h --output=avail / | tail -1 | tr -d ' ')"
          echo "### $HOST — ${USED}% used, ${AVAIL} free" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$USED" -ge 90 ]; then
            echo "::error::$HOST disk ${USED}% (${AVAIL} free)"; fail=1
          elif [ "$USED" -ge 80 ]; then
            echo "::warning::$HOST disk ${USED}% (${AVAIL} free)"
          fi
          if [ "$(systemctl is-active gha-docker-gc.timer 2>/dev/null)" != "active" ]; then
            echo "::error::$HOST gha-docker-gc.timer is NOT active"; fail=1
          fi
          for u in $(systemctl list-units 'actions.runner*' --no-pager --plain --no-legend 2>/dev/null | awk '{print $1}'); do
            state="$(systemctl is-active "$u" 2>/dev/null)"
            printf -- '- %s: %s (Restart=%s)\n' "$u" "$state" "$(systemctl show -p Restart --value "$u" 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
            [ "$state" = active ] || { echo "::error::$HOST $u is $state"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          exit 0
